<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>INTER-BOX — Powitanie (v5.1.1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   INTER-BOX — ekran powitalny na telewizor w wejściu (wersja 5.1.1 — jak 5.1, bez dużego logo w tle)
   Układ 1920×1080, skalowany automatycznie do rozmiaru ekranu.
   ===================================================================== */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06080b; cursor: none; }
* { box-sizing: border-box; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  transform-origin: 0 0; -webkit-transform-origin: 0 0;
  font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #f2f5f8;
  background:
    radial-gradient(1000px 900px at 20% 62%, rgba(53, 210, 138, .12) 0%, rgba(53, 210, 138, 0) 65%),
    linear-gradient(165deg, #0d1218 0%, #07090c 70%);
  transition: transform 4s ease; -webkit-transition: -webkit-transform 4s ease;
}
#logo { position: absolute; left: 96px; top: 66px; height: 92px; }
#clock { position: absolute; right: 96px; top: 54px; text-align: right; }
#time { font-size: 92px; font-weight: 300; letter-spacing: -2px; line-height: 1; }
#time .colon { opacity: .55; padding: 0 2px; }
#date { margin-top: 10px; font-size: 26px; font-weight: 400; color: #8fa1b2; }
#date b { color: #dfe7ee; font-weight: 600; }
/* ukośne paski jak w znaku — separatory */
.rule { position: absolute; height: 18px; background: repeating-linear-gradient(-60deg, rgba(255,255,255,.16) 0 3px, transparent 3px 13px); }
.kicker { white-space: nowrap; overflow: hidden; font-size: 24px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: #8fa1b2; }
.kicker.g { color: #35d28a; }
.kicker.g:before { content: ''; display: inline-block; width: 46px; height: 3px; background: #35d28a; vertical-align: middle; margin: -4px 20px 0 0; border-radius: 2px; }

/* ---------- licznik w sześciokącie ---------- */
#kSafe { position: absolute; left: 96px; top: 262px; width: 600px; font-size: 20px; letter-spacing: .26em; }
#hex { position: absolute; left: 70px; top: 318px; width: 640px; height: 700px; }
#ringNum { position: absolute; left: 70px; top: 318px; width: 640px; height: 700px; text-align: center; }
#days { display: block; font-weight: 900; color: #ffffff; line-height: 1; letter-spacing: -8px; margin-top: 248px; font-size: 200px; }
#daysUnit { display: block; margin-top: 8px; font-size: 34px; font-weight: 700; color: #35d28a; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; }
#hexSub { display: block; margin: 16px auto 0; width: 420px; white-space: nowrap; overflow: hidden; font-size: 20px; color: #8fa1b2; letter-spacing: .04em; }
#badge { display: none; position: absolute; left: 70px; width: 640px; top: 300px; text-align: center; }
#badge span { display: inline-block; font-size: 26px; font-weight: 800; color: #06231a; background: #35d28a; padding: 10px 26px; border-radius: 40px; box-shadow: 0 0 30px rgba(53,210,138,.6); }

/* ---------- powitanie ---------- */
#right { position: absolute; left: 790px; top: 262px; width: 1034px; }
#greet { white-space: nowrap; margin-top: 20px; font-size: 132px; font-weight: 900; line-height: .98; letter-spacing: -4px; }
#greet span { color: #35d28a; }
#sub { margin-top: 22px; font-size: 34px; font-weight: 300; color: #c3ced8; line-height: 1.3; max-width: 1034px; }
#facts { position: absolute; left: 790px; top: 568px; width: 1034px; display: flex; }
.fact { flex: none; margin-right: 46px; font-size: 22px; color: #8fa1b2; white-space: nowrap; overflow: hidden; max-width: 420px; }
.fact b { display: block; font-size: 34px; color: #fff; font-weight: 700; margin-top: 4px; }
.fact.goal b { color: #5df0a8; }

/* ---------- pogoda w sześciokątach ---------- */
#wHead { position: absolute; left: 790px; top: 672px; width: 1034px; height: 30px; white-space: nowrap; overflow: hidden; }
#wHead .kicker { display: inline-block; font-size: 19px; letter-spacing: .26em; vertical-align: middle; }
#wPlace { display: inline-block; font-size: 20px; color: #dfe7ee; font-weight: 600; margin-left: 18px; vertical-align: middle; }
#wDetails { display: inline-block; font-size: 20px; color: #8fa1b2; margin-left: 22px; vertical-align: middle; }
#wDetails b { color: #dfe7ee; font-weight: 600; }
#wDetails .sep { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #3c4a58; margin: 0 12px; vertical-align: middle; margin-top: -3px; }
#wHex { position: absolute; left: 790px; top: 712px; width: 1034px; height: 262px; }
.hx { position: absolute; top: 0; width: 226px; height: 262px; }
.hx svg.f { position: absolute; left: 0; top: 0; width: 226px; height: 262px; }
.hx .in { position: absolute; left: 0; right: 0; top: 0; text-align: center; padding-top: 34px; }
.hx .n { font-size: 24px; font-weight: 700; color: #dfe7ee; white-space: nowrap; }
.hx .ic { width: 82px; height: 82px; margin: 2px auto 0; }
.hx .m { font-size: 30px; font-weight: 700; margin-top: 0; white-space: nowrap; }
.hx .m span { color: #6f8091; font-weight: 400; margin-left: 8px; }
.hx.big .in { padding-top: 26px; }
.hx.big .ic { width: 84px; height: 84px; }
.hx.big .t { font-size: 72px; font-weight: 300; letter-spacing: -3px; line-height: 1; }
.hx.big .s { width: 180px; margin: 2px auto 0; font-size: 20px; color: #b9c6d2; white-space: nowrap; overflow: hidden; }
#wErr { display: none; position: absolute; left: 790px; top: 790px; width: 1034px; font-size: 26px; color: #8fa1b2; }

/* ---------- stopka ---------- */
#foot { position: absolute; left: 96px; right: 96px; bottom: 26px; height: 40px; }
#msg { position: absolute; left: 0; bottom: 0; max-width: 1120px; padding-left: 40px; font-size: 22px; line-height: 1.3; font-weight: 500; color: #b9c6d2; transition: opacity 1s; -webkit-transition: opacity 1s; }
#msg i { position: absolute; left: 0; bottom: 3px; width: 22px; height: 25px; background: #35d28a; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); -webkit-clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
#upd { position: absolute; right: 0; bottom: 2px; font-size: 18px; color: #5f7081; }

/* ---------- przyciemnienie nocne ---------- */
#dim { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 6s; -webkit-transition: opacity 6s; }

/* ---------- animacje ---------- */
.rise { opacity: 0; animation: rise 1.2s ease forwards; -webkit-animation: rise 1.2s ease forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translateY(26px); } to { opacity: 1; -webkit-transform: none; } }
.drift { animation: drift 9s ease-in-out infinite; -webkit-animation: drift 9s ease-in-out infinite; }
@keyframes drift { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
@-webkit-keyframes drift { 0%,100% { -webkit-transform: translateX(-3px); } 50% { -webkit-transform: translateX(3px); } }
.pulse { animation: pulse 1.6s ease; -webkit-animation: pulse 1.6s ease; }
@keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.08); } 100% { transform: scale(1); } }
@-webkit-keyframes pulse { 0% { -webkit-transform: scale(1); } 30% { -webkit-transform: scale(1.08); } 100% { -webkit-transform: scale(1); } }
</style>
</head>

<script>

/* ===================================================================== */
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- pamięć (localStorage może nie działać — wtedy po prostu bez niej) ---------- */

  /* ---------- skalowanie 1920×1080 + ochrona przed wypalaniem ---------- */
  var scale = 1, offX = 0, offY = 0, jitX = 0, jitY = 0;

    var m = new RegExp('[?&#]' + name + '=([^&#]*)').exec(location.href);

  // Widoczny obszar: visualViewport (uwzględnia przybliżenie strony przez przeglądarkę TV),

  function fit() {
    var vv = window.visualViewport, d = document.documentElement;
    var w = (vv && vv.width) || d.clientWidth || window.innerWidth || 1920;
    var h = (vv && vv.height) || d.clientHeight || window.innerHeight || 1080;

    var y = vv ? (vv.pageTop || 0) : (window.pageYOffset || 0);

      var el = $('diag'); el.style.display = 'block';
      el.textContent = 'innerWidth × innerHeight: ' + window.innerWidth + ' × ' + window.innerHeight +

        '\nvisualViewport: ' + (vv ? Math.round(vv.width) + ' × ' + Math.round(vv.height) + ' (zoom ' + (vv.scale || 1).toFixed(2) + ')' : 'brak') +
        '\nscreen: ' + screen.width + ' × ' + screen.height + '   devicePixelRatio: ' + (window.devicePixelRatio || 1) +
        '\nskala strony: ' + scale.toFixed(3) + (forced > 0 ? ' (wymuszona)' : ' (automatyczna)') +

  }
  function applyT() {

  setInterval(function () { // co 3 minuty treść przesuwa się o kilka pikseli
    jitX = Math.round(Math.random() * 16 - 8); jitY = Math.round(Math.random() * 12 - 6); applyT();
  }, 180000);

  /* ---------- daty po polsku ---------- */
  var DNI = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
  var DNI_D = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
  var DNI_S = ['Nd.', 'Pon.', 'Wt.', 'Śr.', 'Czw.', 'Pt.', 'Sob.']; // prognoza na kolejne dni — więcej miejsca na opis
  var MIES = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function parseD(s) { var a = String(s).split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }
  function dStr(o) { return o.y + '-' + p2(o.m) + '-' + p2(o.d); }

  function T(key) {

  function noColon(s) { return String(s).replace(/\s*:\s*$/, ''); }

    fill('kGreet', T('naglowek')); fill('kSafe', T('licznikNaglowek'));
    fill('lLast', noColon(T('etOstatni'))); fill('lRec', noColon(T('etRekord')));

  }

  /* ---------- zegar i powitanie ---------- */
  var podpisIdx = 0;
  function tickClock() {
    var n = new Date();

    $('date').innerHTML = '<b>' + DNI[n.getDay()].charAt(0).toUpperCase() + DNI[n.getDay()].slice(1) + '</b>, ' + n.getDate() + ' ' + MIES[n.getMonth()] + ' ' + n.getFullYear();
    var h = n.getHours();

    if (gEl.getAttribute('data-g') !== g) {
      gEl.innerHTML = /!$/.test(g) ? esc(g.slice(0, -1)) + '<span>!</span>' : esc(g) || '&nbsp;';
      gEl.setAttribute('data-g', g);
      fitW(gEl, 132, 60);

    var night = CONFIG.nocOd > CONFIG.nocDo ? (h >= CONFIG.nocOd || h < CONFIG.nocDo) : (h >= CONFIG.nocOd && h < CONFIG.nocDo);
    $('dim').style.opacity = night ? CONFIG.nocPrzyciemnienie : 0;
    // codzienne przeładowanie — tylko gdy strona jest osiągalna
    var hm = p2(h) + ':' + p2(n.getMinutes());

  }
  function safeReload() {
    var x = new XMLHttpRequest();

  function rotateSub() {
    var el = $('sub');

    podpisIdx++;

    setTimeout(function () {
      el.innerHTML = esc(txt);

  }

  // teksty z arkusza (jeśli są) albo z CONFIG
  function listFrom(kind) {
    var s = SHEET && SHEET[kind];

  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  // zmniejsza czcionkę, aż tekst zmieści się w szerokości swojego pola (max/min w px)

    var el = typeof id === 'string' ? $(id) : id;

  }
  function fitAll() {
    fitW('kGreet', 24, 14); fitW('greet', 132, 60); fitW('kSafe', 20, 12); fitW('hexSub', 20, 12);
    fitFacts();
    var s = document.querySelector('.hx.big .s'); if (s) fitW(s, 20, 12);

    fitText(wd, 20, 13, function () { return wh.scrollWidth > wh.clientWidth + 1; });
  }
  function fitFacts() {
    var f = document.querySelectorAll('.fact');
    for (var i = 0; i < f.length; i++) { fitW(f[i].firstChild, 22, 13); fitW(f[i].lastChild, 34, 18); }
  }
  function fitText(el, max, min, tooBig) {
    var fs = max; el.style.fontSize = fs + 'px';
    while (fs > min && tooBig()) { fs--; el.style.fontSize = fs + 'px'; }
  }

  /* ---------- komunikaty BHP w stopce ---------- */
  var SHIELD = '<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="none" stroke="#35d28a" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#35d28a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var msgIdx = 0;
  function rotateMsg() {
    var el = $('msg');
    el.style.opacity = 0;
    setTimeout(function () {
      var list = listFrom('bhp');
      el.innerHTML = '<i></i>' + esc(list[msgIdx % list.length]);
      fitText(el, 22, 15, function () { return el.offsetHeight > parseFloat(el.style.fontSize) * 1.3 * 2 + 4; }); // max 2 linie
      msgIdx++; el.style.opacity = 1;
    }, 1000);
  }

  /* =====================================================================
     ARKUSZ GOOGLE — jedyne miejsce, w którym zmienia się datę wypadku.
     Kolumna A: nazwa pola, kolumna B: wartość. Wiersze rozpoznawane po słowach
     „wypadek”, „rekord”, „gości/powitanie” — kolejność i wielkość liter bez znaczenia.

     ===================================================================== */
  var SHEET = null, sheetErr = false, wUpd = '', wErrTxt = '';
  function normKey(s) { // bez zmiennych zewnętrznych — wywoływane już przy starcie (lista napisów)
    return String(s).toLowerCase().replace(/[ąćęłńóśźż]/g, function (c) { return 'acelnoszz'.charAt('ąćęłńóśźż'.indexOf(c)); }).replace(/[^a-z]/g, '');
  }
  function parseCSV(txt) {
    var rows = [], row = [], f = '', q = false, i, c;

    for (i = 0; i < txt.length; i++) {

        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && txt.charAt(i + 1) === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;

  }
  // akceptuje: 2026-03-14, 14.03.2026, 14/03/2026 (oraz amerykańskie 3/14/2026, gdy da się to rozpoznać)

    s = String(s).replace(/^\s+|\s+$/g, '');
    var m = /^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/.exec(s), o = null;
    if (m) o = { y: +m[1], m: +m[2], d: +m[3] };
    else {
      m = /^(\d{1,2})([-.\/])(\d{1,2})\2(\d{4})/.exec(s);
      if (m) {

        if (m[2] === '/' && o.m > 12 && o.d <= 12) o = { y: +m[4], m: +m[1], d: +m[3] };
      }
    }
    if (!o || o.m < 1 || o.m > 12 || o.d < 1 || o.d > new Date(o.y, o.m, 0).getDate() || o.y < 2000) return null;
    return o;
  }

      if (rows[i].length < 2) continue;
      var k = normKey(rows[i][0]), v = String(rows[i][1]).replace(/^\s+|\s+$/g, '');

  function loadSheet() {
    if (!CONFIG.arkuszCSV) { sheetErr = true; drawUpd(); return; }
